# Flatpak manifest smoke test (#1596).
#
# The release does not run flatpak-builder (#104): packaging/flatpak/stage_repo.py reads the
# manifest (app id, runtime, command, finish-args, modules) and stages the AppImage payload, and
# build_repo.sh exports and signs the result. A typo in the manifest, in the metainfo and desktop
# entry it installs, or in the app id that three files spell out used to surface only in a
# release. This job checks them whenever a packaging file changes, and weekly.
#
# The same file lives at .forgejo/workflows/flatpak-manifest.yml and
# .github/workflows/flatpak-manifest.yml; keep them byte-identical (a test enforces it).
#
# Deliberately not a job in ci.yml: it must not take a runner on every pull request.
#
# Actions are pinned to full commit SHAs (tag in a trailing comment), as in ci.yml.
name: flatpak-manifest

on:
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "packaging/nadare.desktop"
      - "packaging/nadare.svg"
      - "packaging/build_identity.py"
      - "tests/test_flatpak_manifest_smoke.py"
      - "uv.lock"
      - "requirements.txt"
      - "LICENSE"
      - ".github/workflows/flatpak-manifest.yml"
      - ".forgejo/workflows/flatpak-manifest.yml"
  push:
    branches: [master, main]
    paths:
      - "packaging/flatpak/**"
      - "packaging/nadare.desktop"
      - "packaging/nadare.svg"
      - "packaging/build_identity.py"
      - "tests/test_flatpak_manifest_smoke.py"
      - "uv.lock"
      - "requirements.txt"
      - "LICENSE"
      - ".github/workflows/flatpak-manifest.yml"
      - ".forgejo/workflows/flatpak-manifest.yml"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-manifest-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the check's tools (the versions in uv.lock)
        run: python -m pip install --upgrade pip "pytest==9.1.1" "PyYAML==6.0.3"

      - name: Check the manifest's internal consistency
        # --noconftest: the check only reads repository files, so it needs neither Qt nor the
        # project's runtime dependencies (the suite proper still runs this file as usual).
        # No plugin autoload: the runner's Python can carry a cached pytest-qt, which needs libGL.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_flatpak_manifest_smoke.py

      - name: Install the Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak-builder appstream

      - name: Parse the manifest with flatpak-builder
        # --show-manifest reads the file and prints what the tool understood; it catches YAML
        # flatpak-builder rejects without downloading a runtime or the SDK.
        run: |
          flatpak-builder --show-manifest \
            packaging/flatpak/io.github.frostlinuxdev.Nadare.yml > /dev/null

      - name: Validate the AppStream metadata
        # appstreamcli is what a store reads; --no-net keeps the job offline.
        run: |
          appstreamcli validate --no-net \
            packaging/flatpak/io.github.frostlinuxdev.Nadare.metainfo.xml
