# Continuous integration for the Nadare client repository itself.
#
# The same file lives at .forgejo/workflows/ci.yml and .github/workflows/ci.yml;
# keep them byte-identical (a test enforces it).
#
# The release gate requires the unit suite green on Python 3.12
# and 3.13 with PyQt6 installed, and a clean ruff run.  This job enforces it on
# every push and pull request.  Publishing the Yostar manifests is a separate,
# schedulable job: see ci/yostar-manifests/workflow.yml.
#
# Note: actions are pinned to full commit SHAs (tag in a trailing comment). Keep
# them pinned when updating; change both workflow files together.
name: ci

on:
  # A branch with an open PR used to run everything twice (push + pull_request).
  # Branches are covered by the pull_request run; push runs only for the trunk and the
  # release lines (b29, b30, ...), so a merge gets a full run of its own: two PRs that pass
  # alone can still break together.
  push:
    branches: [master, main, "b[0-9]*"]
  pull_request:
  # A weekly dependency audit (pip-audit) and the PCSDK stub rebuild run on a
  # schedule (or by hand), not on every push.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The weekly scheduled run must not be cancelled by a push, nor cancel one: a group per event.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every job and long step has a time limit: on 2026-11-26 two test jobs sat 2-3 h after
  # a crashed xdist worker and held the runners until cancelled by hand.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.17.0"

      - name: Lint
        run: ruff check src tests packaging scripts ci

      - name: Public text (private names, must-not-say content; the cut checks the same)
        # The name list is private: it lives in this CI's secrets. The public CI has none and skips.
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
          PUBLIC_ONLY: ${{ secrets.PUBLIC_ONLY }}
        run: python scripts/check_public_text.py

      - name: File sizes (warn only, #1248)
        run: python scripts/check_file_sizes.py
        continue-on-error: true

      - name: Format check (non-blocking, see issue #66)
        run: ruff format --check src tests packaging scripts || echo "::warning::ruff format differs (see issue #66)"
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    # A normal run takes ~5-12 min on the shared runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # No display on the runner; Qt uses its offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
      # The shared runner with -n auto is slow under load: stretch wall-clock bounds (#1024).
      NADARE_TEST_TIME_FACTOR: "3"
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Name this week (the package cache below is rebuilt weekly)
        id: debs-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's Qt runtime packages
        # 2026-11-27: the mirror download was a quarter of a test job (63-114 s; one 8 kB
        # package stalled 76 s) and its only flaky step. A hit installs in seconds, offline.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/ci-debs
          key: ci-debs-${{ runner.os }}-${{ steps.debs-week.outputs.week }}-v1

      - name: Install Qt runtime libraries
        # apt has no timeout of its own (a dead archive hung a job ~1 h, 2026-11-19), and a
        # mirror mid-sync fails the whole update ("File has unexpected size", 2026-11-26).
        timeout-minutes: 8
        run: |
          PKGS="libegl1 libgl1 libxkbcommon0 libdbus-1-3 gnupg"
          DEBS="$HOME/ci-debs"
          # The self-hosted job image (nadare-ci) already has them: nothing to do.
          if dpkg -s $PKGS >/dev/null 2>&1; then echo "Already installed"; exit 0; fi
          # The cached set first; if it does not install or leaves a package out, the mirror.
          if ls "$DEBS"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb >/dev/null \
              && dpkg -s $PKGS >/dev/null 2>&1; then
            echo "Installed $(ls "$DEBS"/*.deb | wc -l) packages from this week's cache"
            exit 0
          fi
          rm -rf "$DEBS" && mkdir -p "$DEBS/partial"
          APT="-o Acquire::http::Timeout=20 -o Acquire::Retries=3"
          for attempt in 1 2 3; do
            sudo apt-get $APT update && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          # Downloaded into the cached folder, so this run fills the cache for the week.
          sudo apt-get $APT install -y --no-install-recommends \
            -o Dir::Cache::archives="$DEBS" $PKGS
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
          sudo chmod -R a+rX "$DEBS"

      - name: Pick the tests (a docs-only PR runs the tests that read docs)
        id: pick
        timeout-minutes: 3
        run: python scripts/ci_pick_tests.py "${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies from the lock
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip uv
          uv lock --check
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"

      - name: Test
        # Tests are isolated per test, so they run in parallel; a file stays on one worker
        # (module-scoped Qt fixtures). 6 workers cut a job from ~19 min to ~3 (2026-11-06).
        timeout-minutes: 25
        run: uv run --frozen --extra dev python -m pytest ${{ steps.pick.outputs.targets || 'tests' }} -q -n auto --dist loadfile

      - name: Lifecycle lane (production policies, #1463)
        if: steps.pick.outputs.lane != 'docs'
        # The default run leaves out the "lifecycle" tests (pyproject addopts). They keep the
        # unit suite's safety guards but restore the production policies it stubs, so they run
        # here on their own, serially; -rA prints the faked boundaries of each passing test.
        timeout-minutes: 10
        run: uv run --frozen --extra dev python -m pytest -q -p no:xdist -m lifecycle -rA tests/test_lifecycle_production.py

  stub:
    # #257: the committed stub (the Go build) must match a fresh reproducible
    # build; the build pins its Go image by digest (the C fallback is retired,
    # #1552). Needs a container engine and network, so it runs weekly or on request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test and build the PCSDK stub (Go)
        run: |
          scripts/build_stub_go.sh --test
          scripts/build_stub_go.sh dist/czn_pcsdk_stub.exe

      - name: Compare with the committed stub
        run: |
          sha256sum src/nadare/assets/czn_pcsdk_stub.exe dist/czn_pcsdk_stub.exe
          cmp src/nadare/assets/czn_pcsdk_stub.exe dist/czn_pcsdk_stub.exe

  audit:
    # #588: the lock is the single dependency input; still watch it for advisories.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit the locked dependencies
        run: |
          python -m pip install --upgrade pip pip-audit==2.7.3
          pip-audit -r requirements.txt --strict --progress-spinner off
