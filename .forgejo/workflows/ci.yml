# Continuous integration for the Nadare client repository itself.
#
# The same file lives at .forgejo/workflows/ci.yml and .github/workflows/ci.yml;
# keep them byte-identical (a test enforces it).
#
# The release gate requires the unit suite green on Python 3.12
# and 3.13 with PyQt6 installed, and a clean ruff run.  This job enforces it on
# every push and pull request.  Publishing the Yostar manifests is a separate,
# schedulable job: see ci/yostar-manifests/workflow.yml.
#
# Note: actions are pinned to full commit SHAs (tag in a trailing comment).  A
# hardened release setup should keep them pinned (see the audit
# note in this repository's reports); update both here together.
name: ci

on:
  # A branch with an open PR used to run everything twice (push + pull_request).
  # Branches are covered by the pull_request run; push runs only for the trunk.
  push:
    branches: [master, main]
  pull_request:
  # A weekly dependency audit (pip-audit) and the PCSDK stub rebuild run on a
  # schedule (or by hand), not on every push.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The weekly scheduled run must not be cancelled by a push, nor cancel one: a group per event.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.17.0"

      - name: Lint
        run: ruff check src tests packaging scripts ci

      - name: File sizes (warn only, #1248)
        run: python scripts/check_file_sizes.py
        continue-on-error: true

      - name: Format check (non-blocking, see issue #66)
        run: ruff format --check src tests packaging scripts || echo "::warning::ruff format differs (see issue #66)"
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # No display on the runner; Qt uses its offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -q

  stub:
    # #257: both committed stubs (the Go default and the C fallback) must match
    # fresh reproducible builds. --container pins the Debian image and package
    # snapshot; the Go build pins its Go image by digest. Needs a container
    # engine and network, so it runs weekly or on request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the PCSDK stub (C)
        run: scripts/build_stub.sh --container dist/czn_pcsdk_stub_c.exe

      - name: Test and build the PCSDK stub (Go)
        run: |
          scripts/build_stub_go.sh --test
          scripts/build_stub_go.sh dist/czn_pcsdk_stub.exe

      - name: Compare with the committed stubs
        run: |
          sha256sum src/nadare/assets/czn_pcsdk_stub*.exe dist/czn_pcsdk_stub*.exe
          cmp src/nadare/assets/czn_pcsdk_stub.exe dist/czn_pcsdk_stub.exe
          cmp src/nadare/assets/czn_pcsdk_stub_c.exe dist/czn_pcsdk_stub_c.exe

  audit:
    # #588: the lock is the single dependency input; still watch it for advisories.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit the locked dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off
