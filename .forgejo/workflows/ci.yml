# Continuous integration for the Nadare client repository itself.
#
# The release gate requires the unit suite green on Python 3.12
# and 3.13 with PyQt6 installed, and a clean ruff run.  This job enforces it on
# every push and pull request.  Publishing the Yostar manifests is a separate,
# schedulable job: see ci/yostar-manifests/workflow.yml.
#
# Note: actions are pinned to their major-version tags to stay readable.  A
# hardened release setup should pin them to full commit SHAs (see the audit
# note in this repository's reports); update both here together.
name: ci

on:
  # A branch with an open PR used to run everything twice (push + pull_request).
  # Branches are covered by the pull_request run; push runs only for the trunk.
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.6"

      - name: Lint
        run: ruff check src tests packaging scripts ci

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # No display on the runner; Qt uses its offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -q
