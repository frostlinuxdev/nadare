<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nadare app icon ("nadare" = avalanche / snow). A clean six-armed snowflake
  drawn with SVG paths only (no font text) on the project's blue rounded
  square. Each arm carries two short side branches at ~60% of its length,
  angled ~45 degrees outward, and ends in a plain round tip so the mark reads
  as a snowflake rather than six arrows. Original work by the Nadare
  contributors, released under the same GPL-3.0-or-later terms as the rest of
  the project.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256" role="img" aria-label="Nadare snowflake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5aa4ff"/>
      <stop offset="1" stop-color="#3d8bfd"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#bg)"/>

  <!-- Six arms from the centre hub: no chevrons, just round tips. -->
  <g transform="translate(128 128)" stroke-linecap="round" fill="none">
    <g stroke="#ffffff" stroke-width="15">
      <line x1="0" y1="0" x2="0" y2="-88"/>
      <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(60)"/>
      <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(120)"/>
      <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(240)"/>
      <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(300)"/>
    </g>
    <!-- Two side branches per arm at ~60% length, 45 degrees outward. -->
    <g stroke="#d6e8ff" stroke-width="11">
      <path d="M0 -53 L-17 -70 M0 -53 L17 -70"/>
      <path d="M0 -53 L-17 -70 M0 -53 L17 -70" transform="rotate(60)"/>
      <path d="M0 -53 L-17 -70 M0 -53 L17 -70" transform="rotate(120)"/>
      <path d="M0 -53 L-17 -70 M0 -53 L17 -70" transform="rotate(180)"/>
      <path d="M0 -53 L-17 -70 M0 -53 L17 -70" transform="rotate(240)"/>
      <path d="M0 -53 L-17 -70 M0 -53 L17 -70" transform="rotate(300)"/>
    </g>
    <circle r="14" fill="#d6e8ff" stroke="none"/>
  </g>
</svg>
