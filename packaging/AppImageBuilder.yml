# [SUPERSEDED] appimage-builder recipe for Nadare.
#
# This recipe is NOT used for release builds. `scripts/build_appimage.sh` runs
# PyInstaller (packaging/nadare.spec) into dist/nadare/ and then winds the
# AppDir with `appimagetool` directly, not `appimage-builder`. It is kept only
# as a record of the earlier flow; do not run it to produce a release.
#
# Notes
# -----
# * The PyInstaller bundle already contains Python, PyQt6 and every data file,
#   so no apt packages are bundled. The host must still provide the graphics,
#   audio and (for CZN) Wine/umu stack, exactly as any launcher would. This
#   keeps the AppImage small; it is also why the AppImage is not a fully static
#   self-contained game runtime.
# * AppImage does not remove the glibc requirement: it runs against the host
#   libc. Build on the oldest distro you intend to support.
# * `id` and `icon` are placeholders until the public project identity is
#   chosen (see PLAN.md, open decision #1). Nadare ships no game art; add an
#   owned or licensed icon before publishing.

version: 1

script:
  - rm -rf AppDir
  - mkdir -p AppDir/usr/bin AppDir/usr/share/applications
  - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
  - cp -a dist/nadare/. AppDir/usr/bin/
  - cp packaging/nadare.desktop AppDir/usr/share/applications/nadare.desktop
  - cp packaging/nadare.svg
    AppDir/usr/share/icons/hicolor/scalable/apps/nadare.svg

AppDir:
  path: ./AppDir

  app_info:
    id: org.nadare.launcher
    name: nadare
    icon: nadare
    version: 0.1.0b1
    exec: usr/bin/nadare
    exec_args: "$@"

  runtime:
    env:
      PYTHONNOUSERSITE: "1"
      # Avoid writing __pycache__ into the read-only AppImage mount.
      PYTHONDONTWRITEBYTECODE: "1"

  files:
    include: []
    exclude:
      - usr/bin/_internal/tkinter/**
      - usr/bin/_internal/**/test/**
      - usr/share/doc/**
      - usr/share/man/**

  # Smoke tests are run by the maintainers against a clean HOME (manual
  # matrix row X8) rather than in appimage-builder, whose `test` section
  # requires a Docker image per entry. Build a release and run:
  #
  #     HOME=$(mktemp -d) ./Nadare-<version>-x86_64.AppImage --appimage-extract-and-run --version
  #     HOME=$(mktemp -d) ./Nadare-<version>-x86_64.AppImage --appimage-extract-and-run list

AppImage:
  arch: x86_64
  # Set update-information to a zsync URL when a stable release feed exists.
  # Both keys are omitted for now: appimage-builder treats any string as a real
  # feed ("None" is a string in YAML, not null) and then requires zsyncmake/gpg.
